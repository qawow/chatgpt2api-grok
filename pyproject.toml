[project]
name = "chatgpt2api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "curl-cffi>=0.15.0",
    "fastapi>=0.136.0",
    "pillow>=12.2.0",
    "pybase64>=1.4.3",
    "python-multipart>=0.0.26",
    "tiktoken>=0.12.0",
    "uvicorn>=0.44.0",
    "sqlalchemy>=2.0.0",
    "sqlmodel>=0.0.16",
    "psycopg2-binary>=2.9.0",
    "gitpython>=3.1.0",
    "requests>=2.31.0",
    "PySocks>=1.7.1",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.3.0",
    "pytest-timeout>=2.3.1",
    "coverage>=7.6.0",
]

[tool.pytest.ini_options]
testpaths = ["test"]
# test/manual/ 下是手动脚本（main() + __main__），不是用例，别收集。
norecursedirs = ["test/manual", ".venv", "web", "web_dist", "backups", "data"]
timeout = 300

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple"
default = true
