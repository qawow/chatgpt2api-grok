# 容器日志上限：默认 json-file driver 不轮转，而入口开着 --access-log，
# 长跑几周就能把宿主机磁盘写满。三个 compose 保持同一套配置。
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# /health 不需要鉴权，号池为空时只是 status=degraded 而非 5xx，适合做存活探针。
x-app-healthcheck: &app-healthcheck
  test:
    - CMD
    - python
    - -c
    - "import sys,urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:80/health?format=json', timeout=5).status == 200 else 1)"
  interval: 30s
  timeout: 5s
  retries: 3
  start_period: 40s

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: chatgpt2api:local
    container_name: chatgpt2api-local
    # 此前没有 restart，宿主机重启 / docker 守护进程重启后不会自拉起。
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./data:/app/data
      # ⚠️ 首次启动前必须先 `cp config.example.json config.json`：
      # 宿主机上不存在该文件时，Docker 会把挂载源自动建成【目录】，配置随即全部失效。
      - ./config.json:/app/config.json
      # 不要默认挂载 ./gpt_free_register：宿主机若缺目录，Docker 会挂空目录盖掉镜像内文件。
      # 本地改注册机时再手动打开：
      # - ./gpt_free_register:/app/gpt_free_register:ro
    # 默认 root 运行。改为非 root（推荐）：先在宿主机执行
    #   sudo chown -R 10001:10001 ./data && sudo chown 10001:10001 config.json
    # 再放开下面这行：
    # user: "10001:10001"
    env_file:
      # 读取 .env（README / docs/deployment.md 让用户 `cp .env.example .env`）。
      # required: false 需要 Docker Compose >= 2.24，保证 .env 不存在时也能启动。
      - path: .env
        required: false
    environment:
      # 认证密钥：优先读这里，留空时回落到 config.json 的 auth-key。两处都没有时
      # services/config.py 在导入阶段抛 ValueError（配合 restart 会变成崩溃重启循环）。
      CHATGPT2API_AUTH_KEY: ${CHATGPT2API_AUTH_KEY:-}

      # 容器内监听端口固定 80（入口脚本读 PORT，默认 80），由上面的 8000:80 映射到宿主机。
      # 显式写死是为了盖掉 .env 里可能存在的 PORT（env_file 的值会被 environment 覆盖）。
      PORT: "80"

      # 存储后端配置 (可选值: json, sqlite, postgres, git)
      # 与 docker-compose.yml / docker-compose.warp.yml 统一默认 json：
      # 此前这里写死 sqlite，换个 compose 文件启动就等于换后端，号池会"消失"。
      STORAGE_BACKEND: ${STORAGE_BACKEND:-json}
      # 仅当 STORAGE_BACKEND=sqlite/postgres 时生效
      DATABASE_URL: ${DATABASE_URL:-sqlite:////app/data/accounts.db}
      # 注册机内部 sqlite（避免写只读镜像层）
      REGISTER_ENGINES_DATABASE_URL: ${REGISTER_ENGINES_DATABASE_URL:-sqlite:////app/data/register_engines.db}
      # 基础 URL (可选)
      CHATGPT2API_BASE_URL: ${CHATGPT2API_BASE_URL:-}
      # GPT free register secrets: put CFD1_* / REGISTER_PROXY* in data/gpt_register.env
      # 或直接写进 .env（已由上面的 env_file 注入），例如：
      # CFD1_API_TOKEN / CFD1_ACCOUNT_ID / CFD1_DATABASE_ID / CFD1_DOMAIN / REGISTER_PROXY_DEFAULT

    # Git 仓库配置 (当 STORAGE_BACKEND=git 时使用)，写进 .env 即可：
    #   GIT_REPO_URL / GIT_TOKEN / GIT_BRANCH / GIT_FILE_PATH
    healthcheck: *app-healthcheck
    logging: *default-logging
